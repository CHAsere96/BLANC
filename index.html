<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLANC — Lookbook</title>
  <meta name="description" content="BLANC lookbook" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <header class="top">
    <a class="mark" href="./">BLANC</a>
    <p class="live"><span></span> LOOKBOOK · <em id="count">0</em> plates</p>
  </header>

  <section class="hero">
    <h1>Lookbook</h1>
  </section>

  <div class="filters" role="tablist">
    <button class="on" data-filter="all">All</button>
    <button data-filter="9:16">9:16</button>
    <button data-filter="16:9">16:9</button>
  </div>

  <div class="masonry" id="grid"></div>

  <footer class="foot">
    <span>BLANC</span>
  </footer>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="x" type="button" aria-label="닫기">×</button>
      <div class="sheet-media">
        <img id="m-img" alt="" />
      </div>
      <div class="sheet-body">
        <p class="m-meta" id="m-meta"></p>
        <h2 id="m-title"></h2>
        <pre id="m-prompt"></pre>
        <button class="copy" type="button" id="copy">프롬프트 복사</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">복사했습니다</div>

  <script src="js/works.js"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
